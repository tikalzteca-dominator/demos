<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nelson's Barbería</title>
<style>
:root{--bg:#0b0a09;--fg:#f5efe4;--gold:#e0b45a;--muted:#cfc6b6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
img{display:block;width:100%;height:auto}
.hero{position:relative}
.hero img{max-height:92vh;object-fit:cover}
.hero .t{position:absolute;left:0;right:0;bottom:0;padding:2rem 1.25rem;background:linear-gradient(transparent,rgba(11,10,9,.92))}
h1{font-size:clamp(2rem,7vw,3.5rem);font-weight:normal;letter-spacing:.04em}
.sub{color:var(--muted);font-size:1.15rem;margin-top:.4rem}
main{max-width:56rem;margin:0 auto;padding:2.5rem 1.25rem}
.line{font-size:1.3rem;text-align:center;margin:0 0 2rem}
.btn{display:block;width:100%;max-width:22rem;margin:2.5rem auto 0;padding:1rem;border:2px solid var(--gold);background:transparent;color:var(--gold);font:inherit;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;cursor:not-allowed}
.btn:focus{outline:3px solid var(--fg);outline-offset:3px}
.note{color:var(--muted);text-align:center;font-size:.95rem;margin-top:.6rem}
.price{text-align:center;color:var(--gold);margin-top:2rem;font-size:1.1rem}
footer{border-top:1px solid #3a332a;padding:1.5rem 1.25rem;text-align:center;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<section class="hero">
<img src="img/hero.jpg" alt="Sala de barbería con una silla, paredes de piedra tallada maya y luz dorada" width="1536" height="1024">
<div class="t"><h1>Nelson's Barbería</h1><p class="sub">Una silla. Un cliente. Su tiempo.</p></div>
</section>
<main>
<p class="line">Barbería privada. Piedra antigua, luz cálida, calma.</p>
<img src="img/silla.jpg" alt="Silla de barbero negra con detalles metálicos" width="833" height="610" loading="lazy">
<p class="price">Precio: por confirmar</p>
<button class="btn" type="button" disabled aria-disabled="true">Reservar</button>
<p class="note">Reservas: próximamente.</p>
</main>
<footer>Demo de concepto. El diseño final y los detalles se definen con el dueño.</footer>
</body>
</html>
